<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>.PRO — рабочая сеть</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh;background:#fafaf8;padding-bottom:88px}.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fafaf8eF;backdrop-filter:blur(14px);border-bottom:1px solid #e9e9e5}.logo{font-size:27px;font-weight:900;letter-spacing:-1px}.logo i{color:#ff6f00;font-style:normal}.city{margin-left:auto;color:#666;font-weight:650}.hero{padding:26px 18px 14px}.hero h1{font-size:30px;line-height:1.05;margin:0 0 9px;letter-spacing:-1px}.muted{color:#717171}.search{margin:8px 18px 14px;background:#fff;border:1px solid #deded9;border-radius:14px;padding:13px 14px;width:calc(100% - 36px);outline:none}.chips{display:flex;gap:8px;overflow:auto;padding:0 18px 18px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #deded9;background:#fff;border-radius:999px;padding:9px 12px;font-weight:700}.chip.active{background:#171717;color:#fff;border-color:#171717}.section{padding:5px 18px 18px}.section h2{font-size:19px;margin:8px 0 12px}.venue{background:#fff;border:1px solid #e5e5df;border-radius:18px;padding:16px;margin:10px 0;cursor:pointer}.venue .row,.row{display:flex;align-items:center;gap:10px}.venue h3{margin:0;font-size:17px}.arrow{margin-left:auto;font-size:22px;color:#999}.status{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:8px;background:#fff3e8;color:#a74a00;font-size:12px;font-weight:750}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #ddd;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:none;padding:8px 3px;color:#777;font-size:12px;font-weight:700}.nav b{display:block;font-size:19px;color:#222}.nav.active{color:#ff6f00}.nav.active b{color:#ff6f00}.back{border:0;background:#eee;border-radius:11px;padding:9px 12px;font-weight:800}.detail{padding:20px 18px}.detail h1{font-size:28px;margin:16px 0 4px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.q{background:#fff;border:1px solid #e3e3de;border-radius:15px;padding:14px}.q b{display:block;margin-bottom:5px}.unknown{color:#9a5b25;font-size:13px}.info{background:#fff;border:1px solid #e3e3de;border-radius:18px;padding:4px 15px;margin:12px 0}.line{padding:13px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.line span{display:block;color:#777;font-size:13px}.primary{width:100%;border:0;border-radius:14px;background:#ff6f00;color:#fff;padding:14px;font-weight:850;margin:7px 0}.secondary{width:100%;border:1px solid #ddd;border-radius:14px;background:#fff;padding:14px;font-weight:800;margin:7px 0}.empty{text-align:center;padding:42px 22px;color:#777}.profile{padding:22px 18px}.avatar{width:74px;height:74px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3e3de;border-radius:15px;padding:14px}.stat strong{font-size:22px;display:block}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px}.field textarea{min-height:80px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#171717;color:white;padding:11px 16px;border-radius:12px;z-index:20;display:none;max-width:90%}.badge{font-size:12px;background:#eee;padding:4px 7px;border-radius:8px}.work{background:#fff;border:1px solid #e3e3de;border-radius:15px;padding:13px;margin:8px 0}
</style></head><body><div id="app" class="app"></div><div id="toast" class="toast"></div>
<script>
const venues=["Verona Hall","Роланд","Лимонад","Bakkara Hall","Россия — зал Люмен"];
let filter="Все", screen="home", current=null;
const $=s=>document.querySelector(s); const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function data(){return JSON.parse(localStorage.getItem("proData")||'{"profile":{},"worked":{}}')} function save(d){localStorage.setItem("proData",JSON.stringify(d))}
function shell(body,tab="home"){return '<header class="top"><div class="logo"><i>.</i>PRO</div><div class="city">Чебоксары</div></header>'+body+'<nav class="bottom"><button class="nav '+(tab==="home"?"active":"")+'" onclick="goHome()"><b>⌂</b>Главная</button><button class="nav '+(tab==="worked"?"active":"")+'" onclick="worked()"><b>✓</b>Я работал</button><button class="nav '+(tab==="profile"?"active":"")+'" onclick="profile()"><b>●</b>Профиль</button></nav>'}
function home(){screen="home";let list=venues;if(filter==="Нужны данные")list=venues;if(filter==="Недавно обновлены"||filter==="Рядом")list=[];let body='<section class="hero"><h1>Работай на площадке<br>как будто уже был здесь</h1><div class="muted">Практический опыт event-DJ, собранный в одном месте.</div></section><input id="search" class="search" placeholder="Найти площадку…" oninput="searchVenues(this.value)"><div class="chips">'+["Все","Рядом","Недавно обновлены","Нужны данные"].map(x=>'<button class="chip '+(filter===x?"active":"")+'" onclick="setFilter(\''+x+'\')">'+x+'</button>').join("")+'</div><section class="section"><h2>Площадки Чебоксар</h2><div id="venues">'+(list.length?list.map(card).join(""):'<div class="empty">'+(filter==="Рядом"?"Для «Рядом» понадобится геолокация и координаты площадок. Ничего не придумываем.":"Пока нет подтверждённых обновлений.")+'</div>')+'</div></section>';$("#app").innerHTML=shell(body)}
function card(v){let d=data(),w=d.worked[v];return '<div class="venue" onclick="venue(\''+v.replace(/'/g,"\\'")+'\')"><div class="row"><h3>'+v+'</h3><span class="arrow">›</span></div><div class="status">'+(w?"Вы отметили: работал здесь":"Нужны подтверждённые данные")+'</div></div>'}
function searchVenues(q){let m=venues.filter(v=>v.toLowerCase().includes(q.toLowerCase()));$("#venues").innerHTML=m.length?m.map(card).join(""):'<div class="empty">Ничего не найдено</div>'}
function setFilter(x){filter=x;home()} function goHome(){filter="Все";home()}
function venue(v){current=v;screen="venue";let d=data(),w=d.worked[v];let body='<div class="detail"><button class="back" onclick="home()">← Назад</button><h1>'+v+'</h1><div class="muted">Чебоксары · данные для Event DJ</div><div class="status">Нет подтверждённых данных о площадке</div><div class="quick">'+["🚗|Заезд","⏱|Монтаж","🔌|Подключение","🎒|Что взять"].map(x=>{let a=x.split("|");return '<div class="q"><b>'+a[0]+' '+a[1]+'</b><span class="unknown">Нет данных</span></div>'}).join("")+'</div><div class="info">'+["Парковка и разгрузка","DJ-зона","Звуковая система","Разъёмы и коммутация","Электропитание","Свет / экраны","Интернет","Ограничения","Backstage и бытовые условия","Контакт площадки"].map(x=>'<div class="line"><b>'+x+'</b><span>Нет данных · требуется подтверждение DJ</span></div>').join("")+'</div><button class="primary" onclick="markWorked()">✓ Я работал здесь</button><button class="secondary" onclick="addInfo()">+ Добавить информацию</button>'+(w?'<div class="work"><b>Ваша отметка</b><div>'+esc(w.date||"Дата не указана")+'</div><div class="muted">'+esc(w.note||"Без заметки")+'</div></div>':"")+'</div>';$("#app").innerHTML=shell(body)}
function markWorked(){let d=data(),old=d.worked[current]||{};let date=prompt("Когда вы работали здесь? Например: 20.09.2026",old.date||"");if(date===null)return;let note=prompt("Что важно знать другому DJ? Можно оставить пустым.",old.note||"");d.worked[current]={date,note:note||""};save(d);toast("Площадка добавлена в ваш опыт");venue(current)}
function addInfo(){let note=prompt("Напишите практическую информацию о площадке. В прототипе она сохранится на этом устройстве.");if(!note)return;let d=data();d.worked[current]=d.worked[current]||{date:""};d.worked[current].note=note;save(d);toast("Информация сохранена как ваш вклад");venue(current)}
function worked(){let d=data(),ks=Object.keys(d.worked);let body='<section class="profile"><h1>Я работал здесь</h1><div class="muted">Ваш личный список площадок.</div><div style="margin-top:18px">'+(ks.length?ks.map(v=>'<div class="venue" onclick="venue(\''+v.replace(/'/g,"\\'")+'\')"><div class="row"><h3>'+v+'</h3><span class="arrow">›</span></div><div class="muted">'+esc(d.worked[v].date||"Дата не указана")+'</div></div>').join(""):'<div class="empty">Пока ни одной площадки.<br>Откройте карточку и нажмите «Я работал здесь».</div>')+'</div></section>';$("#app").innerHTML=shell(body,"worked")}
function profile(){let d=data(),p=d.profile||{},n=Object.keys(d.worked).length;let body='<section class="profile"><div class="row"><div class="avatar">'+esc((p.stage||p.name||"DJ").slice(0,2).toUpperCase())+'</div><div><h1 style="margin:0">'+esc(p.stage||"Ваш DJ-профиль")+'</h1><div class="muted">'+esc(p.name||"Заполните рабочую карточку")+'</div></div></div><div class="stats"><div class="stat"><strong>'+n+'</strong><span>площадок</span></div><div class="stat"><strong>'+n+'</strong><span>вкладов</span></div></div><form onsubmit="saveProfile(event)">'+field("name","Имя",p.name,"Роман Георгиев")+field("stage","Сценическое имя",p.stage,"DJ / псевдоним")+field("experience","Опыт",p.experience,"Например: 10 лет")+field("formats","Форматы мероприятий",p.formats,"Свадьбы, корпоративы…")+field("genres","Музыкальные направления",p.genres,"Pop, retro, commercial…")+field("gear","Своё оборудование",p.gear,"Контроллер, микшер…")+'<div class="field"><label>О себе</label><textarea name="bio" placeholder="Коротко о работе">'+esc(p.bio||"")+'</textarea></div><button class="primary">Сохранить профиль</button></form></section>';$("#app").innerHTML=shell(body,"profile")}
function field(n,l,v,ph){return '<div class="field"><label>'+l+'</label><input name="'+n+'" value="'+esc(v||"")+'" placeholder="'+ph+'"></div>'}
function saveProfile(e){e.preventDefault();let d=data(),f=new FormData(e.target);d.profile=Object.fromEntries(f.entries());save(d);toast("Профиль сохранён");profile()}
function toast(t){let e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
home();
</script></body></html>
