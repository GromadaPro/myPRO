<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>.PRO — рабочая сеть</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh;background:#fafaf8;padding-bottom:calc(110px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fafaf8eF;backdrop-filter:blur(14px);border-bottom:1px solid #e9e9e5}.logo{font-size:27px;font-weight:900;letter-spacing:-1px}.logo i{color:#ff6f00;font-style:normal}.city{margin-left:auto;color:#666;font-weight:650}.hero{padding:26px 18px 14px}.hero h1{font-size:30px;line-height:1.05;margin:0 0 9px;letter-spacing:-1px}.muted{color:#717171}.search{margin:8px 18px 14px;background:#fff;border:1px solid #deded9;border-radius:14px;padding:13px 14px;width:calc(100% - 36px);outline:none}.chips{display:flex;gap:8px;overflow:auto;padding:0 18px 18px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #deded9;background:#fff;border-radius:999px;padding:9px 12px;font-weight:700}.chip.active{background:#171717;color:#fff;border-color:#171717}.section{padding:5px 18px 18px}.section h2{font-size:19px;margin:8px 0 12px}.venue{background:#fff;border:1px solid #e5e5df;border-radius:18px;padding:16px;margin:10px 0;cursor:pointer}.venue .row,.row{display:flex;align-items:center;gap:10px}.venue h3{margin:0;font-size:17px}.arrow{margin-left:auto;font-size:22px;color:#999}.status{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:8px;background:#fff3e8;color:#a74a00;font-size:12px;font-weight:750}.bottom{position:sticky;bottom:0;width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #ddd;padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -6px 18px #0000000a}.nav{border:0;background:none;padding:8px 3px;color:#777;font-size:11px;font-weight:700;min-width:0}.nav b{display:block;font-size:19px;color:#222}.nav.active{color:#ff6f00}.nav.active b{color:#ff6f00}.back{border:0;background:#eee;border-radius:11px;padding:9px 12px;font-weight:800}.detail{padding:20px 18px}.detail h1{font-size:28px;margin:16px 0 4px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.q{background:#fff;border:1px solid #e3e3de;border-radius:15px;padding:14px;cursor:pointer}.q:active,.line:active{transform:scale(.99);background:#fff8f1}.q b{display:block;margin-bottom:5px}.unknown{color:#9a5b25;font-size:13px}.info{background:#fff;border:1px solid #e3e3de;border-radius:18px;padding:4px 15px;margin:12px 0}.line{padding:13px 0;border-bottom:1px solid #eee;cursor:pointer}.line:last-child{border:0}.line span{display:block;color:#777;font-size:13px}.primary{width:100%;border:0;border-radius:14px;background:#ff6f00;color:#fff;padding:14px;font-weight:850;margin:7px 0}.secondary{width:100%;border:1px solid #ddd;border-radius:14px;background:#fff;padding:14px;font-weight:800;margin:7px 0}.empty{text-align:center;padding:42px 22px;color:#777}.profile{padding:22px 18px}.avatar{width:74px;height:74px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.stat{background:#fff;border:1px solid #e3e3de;border-radius:15px;padding:14px}.stat strong{font-size:22px;display:block}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px}.field textarea{min-height:80px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#171717;color:white;padding:11px 16px;border-radius:12px;z-index:20;display:none;max-width:90%}.badge{font-size:12px;background:#eee;padding:4px 7px;border-radius:8px}.work{background:#fff;border:1px solid #e3e3de;border-radius:15px;padding:13px;margin:8px 0}.gate{padding:28px 18px}.gate h1{font-size:30px;line-height:1.08;margin:8px 0}.progress{height:8px;background:#e8e8e4;border-radius:9px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:#ff6f00}.profileCard{background:#fff;border:1px solid #e3e3de;border-radius:20px;padding:18px;margin:16px 0}.editBtn{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}.lock{background:#fff7ef;border:1px solid #ffd5b5;border-radius:15px;padding:14px;margin:12px 0}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tag{background:#f1f1ed;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;font-size:13px;font-weight:700}.check input{width:auto}.hint{font-size:12px;color:#777;margin-top:5px}
</style></head><body><div id="app" class="app"></div><div id="toast" class="toast"></div>
<script>
const venues=["Verona Hall","Роланд","Лимонад","Bakkara Hall","Россия — зал Люмен"];
let filter="Все", screen="home", current=null; const quickKeys=["Заезд","Монтаж","Подключение","Что взять"]; const infoKeys=["Парковка и разгрузка","DJ-зона","Звуковая система","Разъёмы и коммутация","Электропитание","Свет / экраны","Интернет","Ограничения","Backstage и бытовые условия","Контакт площадки"];
const $=s=>document.querySelector(s); const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function data(){let d=JSON.parse(localStorage.getItem("proData")||'{"profile":{},"worked":{},"venueInfo":{}}');d.venueInfo=d.venueInfo||{};return d} function save(d){localStorage.setItem("proData",JSON.stringify(d))} function getVal(v,k){let d=data();return d.venueInfo[v]?.[k]||""}
function basicComplete(){let p=data().profile||{};return !!(p.name&&p.stage&&p.experience&&p.formats)} function fullComplete(){let p=data().profile||{};return basicComplete()&&!!(p.travel&&p.gear)} const eventOptions=["Свадьбы","Юбилеи / дни рождения","Корпоративы","Выпускные","Школьные мероприятия","Студенческие мероприятия","Конференции / форумы","Бизнес-мероприятия","Презентации","Выставки","Открытия магазинов / заведений","Промо-мероприятия","Спортивные мероприятия","Городские мероприятия","Фестивали","Концерты","Премии / награждения","Модные показы","Частные вечеринки","Клубы / бары","Караоке / музыкальные игры / квизы","Другое"]; function checks(name,vals,opts){let a=(vals||"").split("|");return '<div class="checks">'+opts.map(x=>'<label class="check"><input type="checkbox" name="'+name+'" value="'+esc(x)+'" '+(a.includes(x)?"checked":"")+'>'+x+'</label>').join("")+'</div>'} function selectField(n,l,v,opts){return '<div class="field"><label>'+l+'</label><select name="'+n+'"><option value="">Выберите</option>'+opts.map(x=>'<option '+(v===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div>'} function shell(body,tab="home"){return '<header class="top"><div class="logo"><i>.</i>PRO</div><div class="city">Чебоксары</div></header>'+body+'<nav class="bottom"><button class="nav '+(tab==="home"?"active":"")+'" onclick="goHome()"><b>⌂</b>Главная</button><button class="nav '+(tab==="worked"?"active":"")+'" onclick="worked()"><b>✓</b>Я работал</button><button class="nav '+(tab==="profile"?"active":"")+'" onclick="profile()"><b>●</b>Профиль</button></nav>'}
function home(){screen="home";let list=venues;if(filter==="Нужны данные")list=venues;if(filter==="Недавно обновлены"||filter==="Рядом")list=[];let body='<section class="hero"><h1>Работай на площадке<br>как будто уже был здесь</h1><div class="muted">Практический опыт event-DJ, собранный в одном месте.</div></section><input id="search" class="search" placeholder="Найти площадку…" oninput="searchVenues(this.value)"><div class="chips">'+["Все","Рядом","Недавно обновлены","Нужны данные"].map(x=>'<button class="chip '+(filter===x?"active":"")+'" onclick="setFilter(\''+x+'\')">'+x+'</button>').join("")+'</div><section class="section"><h2>Площадки Чебоксар</h2><div id="venues">'+(list.length?list.map(card).join(""):'<div class="empty">'+(filter==="Рядом"?"Для «Рядом» понадобится геолокация и координаты площадок. Ничего не придумываем.":"Пока нет подтверждённых обновлений.")+'</div>')+'</div></section>';$("#app").innerHTML=shell(body)}
function card(v){let d=data(),w=d.worked[v];return '<div class="venue" onclick="venue(\''+v.replace(/'/g,"\\'")+'\')"><div class="row"><h3>'+v+'</h3><span class="arrow">›</span></div><div class="status">'+(w?"Вы отметили: работал здесь":"Нужны подтверждённые данные")+'</div></div>'}
function searchVenues(q){let m=venues.filter(v=>v.toLowerCase().includes(q.toLowerCase()));$("#venues").innerHTML=m.length?m.map(card).join(""):'<div class="empty">Ничего не найдено</div>'}
function setFilter(x){filter=x;home()} function goHome(){filter="Все";home()}
function venue(v){if(!basicComplete()){onboarding("view",v);return} current=v;screen="venue";let d=data(),w=d.worked[v];let body='<div class="detail"><button class="back" onclick="home()">← Назад</button><h1>'+v+'</h1><div class="muted">Чебоксары · данные для Event DJ</div><div class="status">Нажмите на любой блок, чтобы заполнить или исправить</div><div class="quick">'+["🚗|Заезд","⏱|Монтаж","🔌|Подключение","🎒|Что взять"].map(x=>{let a=x.split("|"),val=getVal(v,a[1]);return '<div class="q" onclick="editVenueField(\''+a[1]+'\')"><b>'+a[0]+' '+a[1]+'</b><span class="'+(val?"muted":"unknown")+'">'+esc(val||"Нет данных · нажмите, чтобы добавить")+'</span></div>'}).join("")+'</div><div class="info">'+infoKeys.map(x=>{let val=getVal(v,x);return '<div class="line" onclick="editVenueField(\''+x.replace(/'/g,"\\'")+'\')"><b>'+x+'</b><span>'+esc(val||"Нет данных · нажмите, чтобы добавить")+'</span></div>'}).join("")+'</div><button class="primary" onclick="markWorked()">✓ Я работал здесь</button><button class="secondary" onclick="addInfo()">+ Добавить общую заметку</button>'+(w?'<div class="work"><b>Ваша отметка</b><div>'+esc(w.date||"Дата не указана")+'</div><div class="muted">'+esc(w.note||"Без заметки")+'</div></div>':"")+'</div>';$("#app").innerHTML=shell(body)}
function editVenueField(key){if(!fullComplete()){onboarding("edit",current);return}let old=getVal(current,key);let val=prompt(key+" — введите данные. Пустое значение удалит вашу запись.",old);if(val===null)return;let d=data();d.venueInfo[current]=d.venueInfo[current]||{};if(val.trim())d.venueInfo[current][key]=val.trim();else delete d.venueInfo[current][key];save(d);toast("Поле сохранено");venue(current)}
function markWorked(){if(!fullComplete()){onboarding("edit",current);return}let d=data(),old=d.worked[current]||{};let date=prompt("Когда вы работали здесь? Например: 20.09.2026",old.date||"");if(date===null)return;let note=prompt("Что важно знать другому DJ? Можно оставить пустым.",old.note||"");d.worked[current]={date,note:note||""};save(d);toast("Площадка добавлена в ваш опыт");venue(current)}
function addInfo(){editVenueField("Общая заметка")}
function worked(){let d=data(),ks=Object.keys(d.worked);let body='<section class="profile"><h1>Я работал здесь</h1><div class="muted">Ваш личный список площадок.</div><div style="margin-top:18px">'+(ks.length?ks.map(v=>'<div class="venue" onclick="venue(\''+v.replace(/'/g,"\\'")+'\')"><div class="row"><h3>'+v+'</h3><span class="arrow">›</span></div><div class="muted">'+esc(d.worked[v].date||"Дата не указана")+'</div></div>').join(""):'<div class="empty">Пока ни одной площадки.<br>Откройте карточку и нажмите «Я работал здесь».</div>')+'</div></section>';$("#app").innerHTML=shell(body,"worked")}
function profile(){let d=data(),p=d.profile||{},n=Object.keys(d.worked).length;if(!basicComplete()){onboarding("profile");return}let tags=(p.formats||"").split(",").filter(Boolean).map(x=>'<span class="tag">'+esc(x.trim())+'</span>').join("");let body='<section class="profile"><div class="row"><div class="avatar">'+esc((p.stage||p.name||"DJ").slice(0,2).toUpperCase())+'</div><div style="flex:1"><h1 style="margin:0">'+esc(p.stage)+'</h1><div class="muted">'+esc(p.name)+'</div></div><button class="editBtn" onclick="editProfile()">Изменить</button></div><div class="profileCard"><b>Event DJ · '+esc(p.experience)+'</b><div class="tags">'+tags+'</div>'+(p.bio?'<p>'+esc(p.bio)+'</p>':'')+'</div><div class="stats"><div class="stat"><strong>'+n+'</strong><span>площадок</span></div><div class="stat"><strong>'+n+'</strong><span>вкладов</span></div></div>'+(!fullComplete()?'<div class="lock"><b>Профиль заполнен не полностью</b><div class="muted">Дозаполните его, чтобы подтверждать и обновлять данные площадок.</div><button class="secondary" onclick="editProfile(true)">Завершить профиль</button></div>':'<div class="status">✓ Можно вносить данные о площадках</div>')+'</section>';$("#app").innerHTML=shell(body,"profile")}
function editProfile(){let p=data().profile||{};let body='<section class="profile"><button class="back" onclick="profile()">← Профиль</button><h1>Редактирование</h1><form onsubmit="saveProfile(event)">'+field("name","Имя и фамилия",p.name,"Имя и фамилия")+field("stage","Сценическое имя *",p.stage,"DJ / псевдоним")+selectField("experience","Опыт работы",p.experience,["До 1 года","1–3 года","3–5 лет","5–10 лет","10+ лет"])+'<div class="field"><label>На каких мероприятиях вы работаете?</label>'+checks("formats",p.formats,eventOptions)+'</div>'+selectField("travel","Работаете на выезде?",p.travel,["Да","Нет"])+'<div class="field"><label>Оборудование</label>'+checks("gear",p.gear,["Работаю со своим комплектом","Частично своё","Работаю на оборудовании площадки или подрядчика"])+'</div><div class="lock"><b>Контакты и соцсети</b><div class="muted">☎ Телефон · Telegram · Instagram · VK · MAX</div><div class="hint">Подключим позже через подтверждение профиля или специальный тариф.</div></div><button class="primary">Сохранить</button></form></section>';$("#app").innerHTML=shell(body,"profile")}
function onboarding(reason,nextVenue){let p=data().profile||{},editing=reason==="edit";let body='<section class="gate"><div class="logo"><i>.</i>PRO</div><div class="status">'+(editing?'Уровень 2 · вклад в базу':'Регистрация DJ')+'</div><h1>'+(editing?'Дополните профиль':'Создайте рабочий профиль')+'</h1><p class="muted">'+(editing?'Ещё два пункта — и можно подтверждать и обновлять данные площадок.':'Только самое необходимое. Остальное можно добавить позже.')+'</p><div class="progress"><i style="width:'+(editing?'100':'55')+'%"></i></div><form onsubmit="saveOnboarding(event,\''+(nextVenue||"")+'\')">'+field("name","Имя и фамилия *",p.name,"Имя и фамилия")+field("stage","Сценическое имя",p.stage,"Необязательно")+selectField("experience","Опыт работы *",p.experience,["До 1 года","1–3 года","3–5 лет","5–10 лет","10+ лет"])+'<div class="field"><label>На каких мероприятиях вы работаете? *</label>'+checks("formats",p.formats,eventOptions)+'</div>'+(editing?selectField("travel","Работаете на выезде? *",p.travel,["Да","Нет"])+'<div class="field"><label>Оборудование *</label>'+checks("gear",p.gear,["Работаю со своим комплектом","Частично своё","Работаю на оборудовании площадки или подрядчика"])+'</div>':'')+'<button class="primary">'+(editing?'Открыть возможность вносить данные':'Продолжить')+'</button></form></section>';$("#app").innerHTML=body}
function saveOnboarding(e,nextVenue){e.preventDefault();let f=new FormData(e.target),d=data();let o=Object.fromEntries(f.entries());o.formats=f.getAll("formats").join("|");if(f.getAll("gear").length)o.gear=f.getAll("gear").join("|");d.profile={...d.profile,...o};save(d);if(!basicComplete()){toast("Заполните обязательные поля");return}if(nextVenue)venue(nextVenue);else profile()}
function field(n,l,v,ph){return '<div class="field"><label>'+l+'</label><input name="'+n+'" value="'+esc(v||"")+'" placeholder="'+ph+'"></div>'}
function saveProfile(e){e.preventDefault();let d=data(),f=new FormData(e.target);let o=Object.fromEntries(f.entries());o.formats=f.getAll("formats").join("|");o.gear=f.getAll("gear").join("|");d.profile={...d.profile,...o};save(d);toast("Профиль сохранён");profile()}
function toast(t){let e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
home();
</script></body></html>
